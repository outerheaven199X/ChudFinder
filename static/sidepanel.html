<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Chud Finder</title>
<meta name="viewport" content="width=device-width">
<style>
/*@cf-fonts-page*/
:root{/*@cf-vars*/;--bg:var(--cf-ground);--panel:var(--cf-surface);--line:#2c2c33;--fg:var(--cf-ink);--dim:var(--cf-ink-dim);--amber:var(--cf-ember-orange);--accent:var(--cf-field)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--cf-font-sans)}
.mono{font-family:var(--cf-font-mono)}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:0 10px 8px;border-bottom:var(--cf-hairline) solid var(--cf-rule)}
header::before{content:"";display:block;height:6px;margin:0 -10px 8px;background:/*@cf-hazard*/}
.bar{display:flex;gap:6px;align-items:center}
.brand{font:800 15px/1 var(--cf-font-display);font-stretch:125%;letter-spacing:-.01em;color:var(--cf-field);margin-right:auto;text-transform:uppercase}
select,button,textarea{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--cf-rule);border-radius:0}
select{padding:4px 6px;max-width:100%;font:12px var(--cf-font-mono)}
.bar select{flex:1;min-width:0}
.btn{padding:5px 9px;cursor:pointer;font:700 11px/16px var(--cf-font-mono);letter-spacing:.04em;text-transform:uppercase;background:transparent}
.btn:hover{border-color:var(--cf-mark)}.btn.small{padding:2px 7px;font-size:10.5px}
.btn:focus-visible,select:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--cf-focus);outline-offset:1px}
.btn-link{display:inline-block;text-decoration:none;color:var(--fg)}
#tabs{display:flex;gap:0;margin-top:8px;border:1px solid var(--cf-rule)}
.tab{flex:1;padding:5px 2px;font:700 10px/14px var(--cf-font-mono);letter-spacing:.04em;background:none;border:0;border-right:1px solid var(--cf-rule);color:var(--dim);cursor:pointer;border-radius:0}
.tab:last-child{border-right:0}
.tab.active{color:var(--cf-on-field);background:var(--cf-field)}
main{padding:12px 10px}
.pane>*+*{margin-top:8px}
.headline{font-size:15px;line-height:21px;font-weight:700;margin:0}
.sec{display:flex;align-items:center;gap:8px;font:700 11px/16px var(--cf-font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--fg);margin:16px 0 6px;padding-bottom:5px;border-bottom:var(--cf-section-rule) solid var(--cf-mark)}
.sec::before{content:"";width:8px;height:8px;background:var(--cf-field);flex:none}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:0;padding:10px 12px}
.card.conflict{border-color:var(--cf-ember-orange);background:/*@cf-corners*/,var(--panel);--cf-mark:var(--cf-ember-orange)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-title{font-weight:700;text-transform:uppercase;font-size:12.5px;letter-spacing:.01em}
.statement{margin:6px 0 4px}
.post-text{margin:6px 0;white-space:pre-wrap;word-break:break-word}
.meta{color:var(--dim);font:11px/16px var(--cf-font-mono)}
.caveat{color:var(--dim);font-size:12px;margin:4px 0 0}
.tag{font:700 10px/14px var(--cf-font-mono);letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:0;border:1px solid var(--cf-structure);color:#8ea4ff;white-space:nowrap}
.amber{color:var(--amber)!important}.tag.amber{border-color:var(--cf-ember-orange)}
.refs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font:700 10px/14px var(--cf-font-mono);padding:1px 6px;cursor:pointer;color:var(--dim);border-radius:0}
.chip:hover{border-color:var(--cf-mark);color:var(--fg)}
.kv{display:grid;grid-template-columns:100px 1fr;gap:4px 8px;margin:0}
.kv dt{color:var(--dim);font:700 10.5px/16px var(--cf-font-mono);letter-spacing:.04em;text-transform:uppercase;padding-top:1px}.kv dd{margin:0}
.na{color:var(--dim);font-style:italic}.note{color:var(--dim);font:11px/16px var(--cf-font-mono)}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
a.ext{color:var(--cf-emissive-cyan);word-break:break-all}
table.edges{width:100%;border-collapse:collapse;font:11px/16px var(--cf-font-mono)}
.edges th{color:var(--dim);text-transform:uppercase;letter-spacing:.04em;font-weight:700;border-bottom:1px solid var(--cf-rule)}
.edges th,.edges td{border-bottom:1px solid var(--line);padding:4px;text-align:left;vertical-align:top;word-break:break-all}
.conflicts{margin:4px 0;padding-left:18px;color:var(--amber)}
.links{margin:4px 0 0;padding-left:16px;font-size:12px}
.status{font:11px var(--cf-font-mono);color:var(--dim);margin-top:6px;min-height:14px}
.flash{outline:2px solid var(--cf-focus)}
#threadWrap{padding:10px;border-top:var(--cf-section-rule) solid var(--cf-mark)}
#thread{width:100%;height:220px;padding:8px;font:12px/18px var(--cf-font-mono)}
pre{font:12px/18px var(--cf-font-mono);white-space:pre-wrap}
</style></head>
<body>
<header>
  <div class="bar"><img src="../icons/icon32.png" alt="" width="22" height="22" style="display:block;margin-right:8px"><span class="brand mono">CHUD FINDER</span>
    <button id="refresh" class="btn small" type="button" title="Re-observe from the open X tab (new version)">Refresh</button>
    <button id="delete" class="btn small" type="button" title="Delete this local investigation">Delete</button></div>
  <div class="bar" style="margin-top:6px"><select id="recent" aria-label="Recent investigations"></select><select id="version" aria-label="Version"></select></div>
  <nav id="tabs" role="tablist"></nav>
  <div id="status" class="status mono"></div>
</header>
<main id="main"></main>
<div id="threadWrap" hidden>
  <div class="bar"><span class="mono meta" style="margin-right:auto">X THREAD DRAFT (not posted)</span>
    <button id="copyThread" class="btn small" type="button">Copy</button><button id="closeThread" class="btn small" type="button">Close</button></div>
  <textarea id="thread" readonly></textarea>
</div>
<script src="sidepanel.js"></script>
</body></html>
