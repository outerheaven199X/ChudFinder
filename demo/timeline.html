<!doctype html><html><head><meta charset="utf-8"><title>Chud Finder demo timeline (demo data)</title>
<link rel="stylesheet" href="content.css">
<style>
:root{--bg:#000;--fg:#e7e9ea;--dim:#71767b;--line:#2f3336}
body.light{--bg:#fff;--fg:#0f1419;--dim:#536471;--line:#eff3f4}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/20px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.col{width:600px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
.top{padding:14px 16px;font-weight:800;font-size:20px;border-bottom:1px solid var(--line)}
.top small{display:block;font-weight:400;font-size:12px;color:var(--dim)}
article{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff}
.body{flex:1;min-width:0}
[data-testid="User-Name"]>div{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.nm{font-weight:700}.h,.dt{color:var(--dim)} a{color:inherit;text-decoration:none}
[data-testid="tweetText"]{margin-top:2px;white-space:pre-wrap}
</style></head>
<body>
<div class="col"><div class="top">Home<small>DEMO DATA · fictional accounts · not live X</small></div><div id="tl"></div></div>
<script src="seed.js"></script>
<script>
const POSTS = [
  ['demo_civicdesk','Civic Desk (demo)','#1d9bf0','City council meets Thursday on the new library hours. Agenda is posted.', 'en'],
  ['demo_sambawire','Samba Wire (demo)','#00a86b','Carnival rehearsal schedule is out. Bring water.', 'en'],
  ['demo_relaynode','Relay Node (demo)','#7856ff','Big week for open-source maintainers. Patch notes below.', 'en'],
  ['demo_borderdesk','Border Watch Daily (demo)','#f91880','The White House and Brussels are hiding what is really happening at the southern border. The EU migration pact is next. Share before it\u2019s gone.', 'en'],
  ['sample_unlisted','Unlisted (demo)','#536471','New here. Hello timeline!', 'en'],
  ['demo_osaka_eats','Osaka Eats (demo)','#ff7a00','Good morning from Osaka. Best breakfast spot near the station?', 'en'],
  ['demo_statehouse','Statehouse Notes (demo)','#00ba7c','Lok Sabha session extended again, opposition walks out over the rupee bill.', 'en']
];
const tl = document.getElementById('tl');
POSTS.forEach(([h, n, c, t, lang], i) => {
  const id = String(1900000000000000000n + BigInt(i));
  const a = document.createElement('article'); a.setAttribute('data-testid', 'tweet');
  a.innerHTML = '<div class="av"></div><div class="body"><div data-testid="User-Name"><div><a href="/' + h + '"><span class="nm"></span></a> <a href="/' + h + '"><span class="h">@' + h + '</span></a><span class="dt"> · </span><a href="/' + h + '/status/' + id + '"><time datetime="2026-10-29T1' + i + ':05:00.000Z" class="dt">' + (i + 1) + 'h</time></a></div></div><div data-testid="tweetText" lang="' + lang + '"></div></div>';
  a.querySelector('.av').style.background = c; a.querySelector('.av').textContent = n[0];
  a.querySelector('.nm').textContent = n; a.querySelector('[data-testid="tweetText"]').textContent = t;
  tl.appendChild(a);
});
if (location.hash.includes('light')) document.body.classList.add('light');
</script>
<script src="content.js"></script>
<script>
setTimeout(() => window.postMessage({ __chudFinder: true, type: 'locations', payload: window.__cfDemoLocations }, '*'), 50);
</script>
</body></html>
